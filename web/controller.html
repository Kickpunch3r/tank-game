<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tank driver</title>
<style>
  /* Placeholder look: plain and high-contrast. Restyle freely. */
  :root {
    --background: #111;
    --track: #2a2a2a;
    --track-edge: #666;
    --notch: #777;
    --zero-line: #fff;
    --thumb: #ffcc22;
    --text: #fff;
    --brake: #c62828;
    --brake-held: #ff5252;
    --driver: #2e9e4f;
    --spectator: #2f6fb5;
    --waiting: #8a6d1a;
    --lost: #a33;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--background); color: var(--text);
    font: 16px system-ui, sans-serif;
    /* No scrolling, zooming, text selection or pull-to-refresh. */
    touch-action: none; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #layout { display: flex; height: 100%; }
  .lever-zone {
    flex: 0 0 34%; display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  .track {
    position: relative; width: min(120px, 60%); height: 88%;
    background: var(--track); border: 3px solid var(--track-edge); border-radius: 18px;
  }
  .notch {
    position: absolute; left: 10%; right: 10%; height: 2px; margin-top: -1px; background: var(--notch);
  }
  .notch.zero { left: -12px; right: -12px; height: 4px; margin-top: -2px; background: var(--zero-line); }
  .thumb {
    position: absolute; left: -10px; right: -10px; height: 56px; margin-top: -28px; top: 50%;
    background: var(--thumb); border-radius: 14px; box-shadow: 0 0 0 3px #000 inset;
  }
  .lever-value { position: absolute; bottom: -1.6em; width: 100%; text-align: center; font-size: 14px; white-space: nowrap; }
  #middle {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; text-align: center; padding: 8px;
  }
  #status { padding: 8px 14px; border-radius: 10px; font-weight: bold; font-size: 17px; background: var(--waiting); }
  #status.driver { background: var(--driver); }
  #status.spectator { background: var(--spectator); }
  #status.lost { background: var(--lost); }
  #brake {
    width: min(100%, 220px); height: 38vh; min-height: 90px; border-radius: 20px;
    background: var(--brake); border: 4px solid #000; color: #fff;
    font: bold 28px system-ui, sans-serif; letter-spacing: 2px; touch-action: none;
  }
  #brake.held { background: var(--brake-held); }
  button {
    font: inherit; color: var(--text); background: #333; border: 2px solid #777;
    border-radius: 10px; padding: 8px 14px;
  }
  #tip { font-size: 12px; opacity: 0.7; max-width: 22em; }
  #settings {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.88); display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 16px;
  }
  #settings.open { display: flex; }
  #settings label { font-size: 20px; display: flex; align-items: center; gap: 12px; }
  #settings input[type=checkbox] { width: 28px; height: 28px; }
  #turn-sideways {
    position: fixed; inset: 0; background: var(--background); display: none;
    align-items: center; justify-content: center; font-size: 24px; text-align: center; padding: 20px;
  }
  @media (orientation: portrait) { #turn-sideways { display: flex; } }
</style>
</head>
<body>
<div id="layout">
  <div class="lever-zone" id="left-zone">
    <div class="track"><div class="thumb" id="left-thumb"></div>
      <div class="lever-value" id="left-value"></div></div>
  </div>
  <div id="middle">
    <div id="status">Connecting...</div>
    <button id="brake">BRAKE</button>
    <button id="settings-button">Settings</button>
    <div id="tip"></div>
  </div>
  <div class="lever-zone" id="right-zone">
    <div class="track"><div class="thumb" id="right-thumb"></div>
      <div class="lever-value" id="right-value"></div></div>
  </div>
</div>

<div id="settings">
  <label><input type="checkbox" id="spring-return"> Levers spring back to 0 when let go</label>
  <label><input type="checkbox" id="vibration"> Vibration</label>
  <button id="fullscreen-button">Full screen</button>
  <button id="close-settings">Close</button>
</div>
<div id="turn-sideways">Turn your phone sideways to drive.</div>

<script>
"use strict";
// --- Filled in by the game when it serves this page ---------------------------
const PORT_TEXT = "{{WEBSOCKET_PORT}}";
const LEVELS_TEXT = "{{TREAD_LEVELS}}";
const WEBSOCKET_PORT = PORT_TEXT.startsWith("{{") ? 8081 : Number(PORT_TEXT);
// Push for levels 1, 2, 3 (same backwards); matches the keyboard (TreadLevels in the game).
const LEVEL_VALUES = LEVELS_TEXT.startsWith("{{") ? [0.25, 0.5, 1] : JSON.parse(LEVELS_TEXT);
const MAX_LEVEL = LEVEL_VALUES.length;

const SEND_EVERY_MS = 33;        // at most ~30 times a second on change
const HEARTBEAT_MS = 150;        // at least this often otherwise (game watchdog: 250 ms)
const RECONNECT_MS = 1000;

function loadSetting(name, fallback) {
  try { const v = localStorage.getItem(name); return v === null ? fallback : v === "true"; }
  catch (e) { return fallback; }
}
function saveSetting(name, value) { try { localStorage.setItem(name, String(value)); } catch (e) {} }

// Levers stay where you leave them unless this setting is switched on.
let springReturn = loadSetting("springReturn2", false);
let vibration = loadSetting("vibration", true);

function levelValue(level) {
  return level === 0 ? 0 : Math.sign(level) * LEVEL_VALUES[Math.abs(level) - 1];
}

// --- Levers: notched, one finger each ----------------------------------------
// Notches are evenly spaced (not by value), so every notch is equally easy to hit.
const levers = {
  left:  { level: 0, pointer: null, zone: document.getElementById("left-zone"),
           thumb: document.getElementById("left-thumb"), label: document.getElementById("left-value") },
  right: { level: 0, pointer: null, zone: document.getElementById("right-zone"),
           thumb: document.getElementById("right-thumb"), label: document.getElementById("right-value") },
};

function trackOf(lever) { return lever.thumb.parentElement; }
function travelOf(lever) { return (trackOf(lever).clientHeight - lever.thumb.offsetHeight) / 2; }

function drawNotches(lever) {
  const track = trackOf(lever);
  for (const old of track.querySelectorAll(".notch")) old.remove();
  for (let level = -MAX_LEVEL; level <= MAX_LEVEL; level++) {
    const mark = document.createElement("div");
    mark.className = level === 0 ? "notch zero" : "notch";
    mark.style.top = (track.clientHeight / 2 - (level / MAX_LEVEL) * travelOf(lever)) + "px";
    track.insertBefore(mark, lever.thumb);
  }
}

function setLevel(lever, level) {
  level = Math.max(-MAX_LEVEL, Math.min(MAX_LEVEL, level));
  const changed = level !== lever.level;
  lever.level = level;
  // Drawn from the level: centre for 0, the ends for +3 / -3.
  const track = trackOf(lever);
  lever.thumb.style.top = (track.clientHeight / 2 - (level / MAX_LEVEL) * travelOf(lever)) + "px";
  lever.label.textContent = (level > 0 ? "+" : "") + level + "  (" + levelValue(level).toFixed(2) + ")";
  if (changed) { buzz(level === 0 ? 30 : 12); sendSoon(); }
}

function levelFromPointer(lever, clientY) {
  const rect = trackOf(lever).getBoundingClientRect();
  const fraction = (rect.top + rect.height / 2 - clientY) / travelOf(lever);
  return Math.round(fraction * MAX_LEVEL);
}

for (const lever of Object.values(levers)) {
  lever.zone.addEventListener("pointerdown", (e) => {
    if (lever.pointer !== null) return;
    e.preventDefault();
    lever.pointer = e.pointerId;
    // Keep this finger on this lever even if it slides off; never let a
    // refusal here stop the lever working.
    try { lever.zone.setPointerCapture(e.pointerId); } catch (error) {}
    setLevel(lever, levelFromPointer(lever, e.clientY));
  });
  lever.zone.addEventListener("pointermove", (e) => {
    if (e.pointerId !== lever.pointer) return;
    e.preventDefault();
    setLevel(lever, levelFromPointer(lever, e.clientY));
  });
  const letGo = (e) => {
    if (e.pointerId !== lever.pointer) return;
    lever.pointer = null;
    if (springReturn) setLevel(lever, 0);
  };
  lever.zone.addEventListener("pointerup", letGo);
  lever.zone.addEventListener("pointercancel", letGo);
}
document.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// --- Brake: hold to brake; pressing it also puts both levers back to 0 -------
const brakeButton = document.getElementById("brake");
let brakeHeld = false;
let brakePointer = null;
brakeButton.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  brakePointer = e.pointerId;
  try { brakeButton.setPointerCapture(e.pointerId); } catch (error) {}
  brakeHeld = true;
  brakeButton.classList.add("held");
  setLevel(levers.left, 0);
  setLevel(levers.right, 0);
  buzz(40);
  sendNow();
});
const releaseBrake = (e) => {
  if (e.pointerId !== brakePointer) return;
  brakePointer = null;
  brakeHeld = false;
  brakeButton.classList.remove("held");
  sendNow();
};
brakeButton.addEventListener("pointerup", releaseBrake);
brakeButton.addEventListener("pointercancel", releaseBrake);

// --- Talking to the game ----------------------------------------------------
const statusBox = document.getElementById("status");
let socket = null;
let role = "";
let lastSent = 0;
let sendPending = false;

function setStatus(text, kind) {
  statusBox.textContent = text;
  statusBox.className = kind;
}

function connect() {
  setStatus("Connecting...", "");
  role = "";
  socket = new WebSocket("ws://" + location.hostname + ":" + WEBSOCKET_PORT);
  socket.onopen = () => {
    // Never resume driving with old lever positions after a reconnect.
    setLevel(levers.left, 0);
    setLevel(levers.right, 0);
    socket.send(JSON.stringify({ t: "hello", role: "driver" }));
    sendNow();
  };
  socket.onmessage = (event) => {
    let message;
    try { message = JSON.parse(event.data); } catch (e) { return; }
    if (message.t === "welcome") {
      role = message.role;
      if (role === "driver") setStatus("Driving", "driver");
      else setStatus("Watching (another phone is driving)", "spectator");
    } else if (message.t === "buzz") {
      buzz(Number(message.ms) || 40);
    }
  };
  socket.onclose = () => {
    setStatus("Disconnected - retrying...", "lost");
    role = "";
    setTimeout(connect, RECONNECT_MS);
  };
  socket.onerror = () => {};  // onclose follows and retries
}

function sendNow() {
  if (!socket || socket.readyState !== WebSocket.OPEN) return;
  socket.send(JSON.stringify({
    t: "in", l: levelValue(levers.left.level), r: levelValue(levers.right.level), b: brakeHeld ? 1 : 0,
  }));
  lastSent = performance.now();
  sendPending = false;
}
function sendSoon() { sendPending = true; }

// Send soon after a change (at most ~30 times a second), and a heartbeat
// otherwise, so the game knows the phone is still there.
setInterval(() => {
  const since = performance.now() - lastSent;
  if (sendPending && since >= SEND_EVERY_MS) sendNow();
  else if (since >= HEARTBEAT_MS) sendNow();
}, 16);

// --- Vibration (Android; iPhones ignore it) ---------------------------------
function buzz(ms) {
  if (!vibration) return;
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
}

// --- Keeping the screen awake -----------------------------------------------
// Needs a secure (https) page; the game's page usually isn't, so show a tip.
const tip = document.getElementById("tip");
async function keepAwake() {
  try {
    if ("wakeLock" in navigator && window.isSecureContext) {
      await navigator.wakeLock.request("screen");
      tip.textContent = "";
      return;
    }
  } catch (e) {}
  tip.textContent = "Tip: raise your phone's screen timeout so it stays on while driving.";
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });

// --- Settings menu -------------------------------------------------------------
const settings = document.getElementById("settings");
const springBox = document.getElementById("spring-return");
const vibrationBox = document.getElementById("vibration");
springBox.checked = springReturn;
vibrationBox.checked = vibration;
document.getElementById("settings-button").onclick = () => settings.classList.add("open");
document.getElementById("close-settings").onclick = () => settings.classList.remove("open");
springBox.onchange = () => {
  springReturn = springBox.checked;
  saveSetting("springReturn2", springReturn);
  for (const lever of Object.values(levers)) if (springReturn && lever.pointer === null) setLevel(lever, 0);
};
vibrationBox.onchange = () => { vibration = vibrationBox.checked; saveSetting("vibration", vibration); };
document.getElementById("fullscreen-button").onclick = () => {
  try { document.documentElement.requestFullscreen(); } catch (e) {}
};

function redraw() {
  for (const lever of Object.values(levers)) { drawNotches(lever); setLevel(lever, lever.level); }
}
window.addEventListener("resize", redraw);
redraw();
keepAwake();
connect();
</script>
</body>
</html>
