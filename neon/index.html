<title>Neon Treads</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap">
<style>
  /* Layout: full-screen 3D view. Status pips along the top, two thumb levers in the bottom
     corners with the fire button between them. One dark neon look in every theme. */
  :root {
    color-scheme: dark;
    --void: #03050b;
    --panel: rgba(6, 16, 28, 0.72);
    --line: rgba(79, 240, 255, 0.55);
    --cyan: #4ff0ff;
    --cyan-dim: rgba(79, 240, 255, 0.22);
    --gold: #ffc94a;
    --red: #ff3350;
    --ink: #d9fbff;
    --font-title: "Orbitron", "Trebuchet MS", "Segoe UI", sans-serif;
    --font-data: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--void); color: var(--ink); font-family: var(--font-title);
    overflow: hidden; touch-action: none; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .screen-pad {
    padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* ---- playing ---- */
  #hud { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
  #topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  #status { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 6px; align-items: center; min-height: 14px; }
  .pip { display: inline-block; box-sizing: border-box; }
  .pip.health { width: 22px; height: 12px; border: 2px solid var(--cyan); transform: skewX(-18deg); }
  .pip.health.on { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .pip.friend { width: 13px; height: 13px; border: 2px solid var(--gold); transform: rotate(45deg); margin: 0 3px; }
  .pip.friend.on { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan-dim); }
  .dot.on { background: var(--ink); box-shadow: 0 0 6px var(--cyan); }
  #buttons { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .icon-button {
    pointer-events: auto; width: 40px; height: 40px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  }
  .icon-button:active { background: var(--cyan-dim); }
  .icon-button svg { width: 22px; height: 22px; stroke: var(--cyan); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #debugMenu {
    pointer-events: auto; display: flex; flex-direction: column; gap: 6px; width: 168px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px;
    font-family: var(--font-data); font-size: 11px;
  }
  #debugMenu button { background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 7px 6px; font-family: var(--font-data); font-size: 11px; text-align: left; }
  #debugMenu button:active { background: var(--cyan-dim); }
  #dbgInfo { white-space: pre-wrap; line-height: 1.4; opacity: 0.8; }

  #controls { display: flex; justify-content: space-between; align-items: flex-end; }
  .lever { pointer-events: auto; touch-action: none; width: 36%; height: min(46vh, 330px); display: flex; flex-direction: column; justify-content: flex-end; }
  .lever.left { align-items: flex-start; }
  .lever.right { align-items: flex-end; }
  .slot { position: relative; width: 68px; height: min(30vh, 210px); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .slot::before { content: ""; position: absolute; left: 8px; right: 8px; top: 50%; height: 2px; margin-top: -1px; background: var(--line); }
  .grip { position: absolute; left: 5px; right: 5px; top: 50%; height: 44px; margin-top: -22px; background: var(--cyan); border-radius: 5px; box-shadow: 0 0 14px var(--cyan); }
  #fire {
    pointer-events: auto; touch-action: none; position: relative; flex: none;
    width: 84px; height: 84px; border-radius: 50%; padding: 0; margin-bottom: 20px; border: none;
    /* the ring fills as the laser reloads */
    background: conic-gradient(var(--cyan) calc(var(--ready, 1) * 360deg), var(--cyan-dim) 0);
  }
  #fire::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: #06141f; }
  #fire svg { position: absolute; inset: 22px; width: 40px; height: 40px; stroke: var(--cyan); fill: none; stroke-width: 2.5; stroke-linecap: round; }
  #fire:active::before { background: #0c3344; }

  /* ---- title and ending ---- */
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; background: rgba(3, 5, 11, 0.62); }
  h1 { margin: 0; font-size: clamp(38px, 12vw, 64px); font-weight: 800; line-height: 1.02; letter-spacing: 0.08em; text-align: center; color: var(--ink); text-shadow: 0 0 18px var(--cyan), 0 0 3px var(--cyan); }
  .round {
    width: 96px; height: 96px; border-radius: 50%; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: #06141f; border: 3px solid var(--cyan); box-shadow: 0 0 22px var(--cyan), inset 0 0 14px var(--cyan-dim);
  }
  .round:active { background: #0c3344; }
  .round svg { width: 44px; height: 44px; fill: var(--cyan); stroke: var(--cyan); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  #levelPick { display: flex; gap: 14px; }
  .pick { width: 46px; height: 46px; background: #06141f; border: 2px solid var(--line); border-radius: 6px; font-size: 18px; font-weight: 600; }
  .pick.on { border-color: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
  .pick:disabled { opacity: 0.3; }
  #ending { background: rgba(20, 14, 2, 0.6); }
  #emblem { position: relative; width: 150px; height: 150px; border: 3px solid var(--gold); border-radius: 50%; box-shadow: 0 0 34px var(--gold), inset 0 0 22px rgba(255, 201, 74, 0.35); }
  #emblem::before { content: ""; position: absolute; left: 50%; top: 50%; width: 40px; height: 84px; margin: -42px 0 0 -20px; background: #fff3cf; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); filter: drop-shadow(0 0 10px var(--gold)); }
  #ending .round { border-color: var(--gold); box-shadow: 0 0 22px var(--gold); }
  #ending .round svg { stroke: var(--gold); fill: none; }

  #flash { position: fixed; inset: 0; background: #dffcff; opacity: 0; pointer-events: none; transition: opacity 0.9s ease-in; }
  #flash.on { opacity: 1; }
  #fail { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; background: var(--void); font: 15px var(--font-data); }
  @media (prefers-reduced-motion: reduce) { #flash { transition: none; } }
</style>

<canvas id="view"></canvas>

<div id="hud" class="screen-pad" hidden>
  <div id="topbar">
    <div id="status">
      <div class="row" id="health" aria-label="Shield"></div>
      <div class="row" id="friends" aria-label="Friends rescued"></div>
      <div class="row" id="levelDots" aria-label="Level"></div>
    </div>
    <div id="buttons">
      <button id="toCheckpoint" class="icon-button" type="button" aria-label="Back to checkpoint">
        <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v5h5"/></svg>
      </button>
      <button id="debugToggle" class="icon-button" type="button" aria-label="Debug menu">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div id="debugMenu" hidden>
        <div id="dbgInfo">…</div>
        <button id="dbgRestart" type="button">Restart level</button>
        <button id="dbgNext" type="button">Skip to next level</button>
        <button id="dbgShake" type="button">Allow shake</button>
        <button id="dbgSound" type="button">Sound: on</button>
      </div>
    </div>
  </div>
  <div id="controls">
    <div class="lever left" id="leverL"><div class="slot"><div class="grip"></div></div></div>
    <button id="fire" type="button" aria-label="Fire laser">
      <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="9"/><path d="M20 2v10M20 28v10M2 20h10M28 20h10"/></svg>
    </button>
    <div class="lever right" id="leverR"><div class="slot"><div class="grip"></div></div></div>
  </div>
</div>

<div id="title" class="screen screen-pad">
  <h1>NEON<br>TREADS</h1>
  <button id="play" class="round" type="button" aria-label="Play">
    <svg viewBox="0 0 24 24"><path d="M8 5l12 7-12 7z"/></svg>
  </button>
  <div id="levelPick"></div>
</div>

<div id="ending" class="screen screen-pad" hidden>
  <div id="emblem"></div>
  <button id="again" class="round" type="button" aria-label="Back to the start">
    <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v5h5"/></svg>
  </button>
</div>

<div id="flash"></div>
<div id="fail" hidden>The game could not load. Check the connection and reload the page.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="levels.js"></script>
<script src="world.js"></script>
<script src="game.js"></script>
